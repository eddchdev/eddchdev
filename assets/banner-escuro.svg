<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Eduardo Chamorra, fundador da Convello">
  <defs>
    <linearGradient id="destaque" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="492" y2="0">
      <stop offset="0" stop-color="#3665e4"/>
      <stop offset="1" stop-color="#7c9cf5"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3665e4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3665e4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff0d" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .nome { font-size: 56px; font-weight: 600; letter-spacing: -1px; fill: #f4f6fb; }
      .tag { font-size: 18px; font-weight: 500; letter-spacing: 0; fill: #3665e4; }
      .entra { opacity: 0; animation: entra .9s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; }
      @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .linha { stroke-dasharray: 420; stroke-dashoffset: 420; animation: traca 1.6s .9s ease-out forwards; }
      @keyframes traca { to { stroke-dashoffset: 0; } }
      .pulso { animation: pulso 2.8s ease-in-out infinite; transform-origin: 1085px 150px; }
      @keyframes pulso { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .entra, .linha, .pulso { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0b0f17"/>
  <rect width="1200" height="300" rx="20" fill="url(#grade)" opacity="0.5"/>
  <rect width="1200" height="300" rx="20" fill="url(#brilho)"/>
  <g class="t">
    <text x="72" y="112" class="tag entra d1">Fundador da Convello</text>
    <text x="70" y="176" class="nome entra d2">Eduardo Chamorra</text>
  </g>
  <line x1="72" y1="210" x2="492" y2="210" stroke="url(#destaque)" stroke-width="3" stroke-linecap="round" class="linha"/>
  <g class="pulso">
    <circle cx="1085" cy="150" r="54" fill="none" stroke="#3665e4" stroke-width="1.5" opacity=".5"/>
    <circle cx="1085" cy="150" r="34" fill="none" stroke="#3665e4" stroke-width="1.5" opacity=".7"/>
    <circle cx="1085" cy="150" r="8" fill="#3665e4"/>
  </g>
</svg>
